# Definition of organization-service for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/organization-service.yaml for the environment it deploys to.
#
# Internal service: no Traefik label, no published port. Secret values (the database URLs and the
# NATS password) are referenced by name; they live in cadenway-ops, which documents every variable
# below in docs/service-environment.md. Required variables must exist on the host before the
# release that reads them. The Search variables default to empty during a staged rollout.
#
# INTERNAL_TOKEN_TRUSTED_ISSUERS configures the API gateway. Search and Identity activate with
# their optional public keys. The folded scalar gives the service one line of JSON.
#
# MIGRATION_DATABASE_URL is deliberately absent: the GitOps agent of cadenway-ops hands the
# migrator's URL to the one-off migration container only (docs/database.md there), so the running
# service never holds the owner credentials of its schema.
services:
  organization-service:
    image: ghcr.io/${GHCR_OWNER}/cadenway-organization-service:${ORGANIZATION_SERVICE_VERSION}
    restart: unless-stopped
    environment:
      PORT: '3011'
      DATABASE_URL: ${ORGANIZATION_SERVICE_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NATS_USER: organization
      NATS_PASSWORD: ${ORGANIZATION_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: organization-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
      SEARCH_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${SEARCH_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      IDENTITY_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${IDENTITY_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      SEARCH_PROJECTION_CURSOR_SECRET: ${ORGANIZATION_SEARCH_PROJECTION_CURSOR_SECRET:-}
      BILLING_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${BILLING_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      NOTIFICATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS: ${NOTIFICATION_SERVICE_INTERNAL_TOKEN_PUBLIC_JWKS:-}
      BILLING_AUTHORITY_CURSOR_SECRET: ${ORGANIZATION_BILLING_AUTHORITY_CURSOR_SECRET:-}
      ORGANIZATION_SEAT_QUOTA_ENABLED: ${ORGANIZATION_SEAT_QUOTA_ENABLED:-false}
      ORGANIZATION_SEAT_ENTITLEMENT_EVENTS_ENABLED: ${ORGANIZATION_SEAT_ENTITLEMENT_EVENTS_ENABLED:-false}
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3011/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every service definition it includes.
networks:
  internal: {}
